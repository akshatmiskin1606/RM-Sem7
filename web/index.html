<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131416" />
    <script>
      try {
        if (localStorage.getItem('kaqg-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch { /* The theme can still be changed when browser storage is off. */ }
    </script>
    <title>Study Grid · PDF to questions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
